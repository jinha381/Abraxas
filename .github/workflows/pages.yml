name: Publish HatchMind Game

on:
  push:
    branches: [main]
    paths:
      - "game/**"
      - "scripts/build-game.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Check and package the standalone game
        run: |
          node --check game/app.js
          node scripts/build-game.cjs "$RUNNER_TEMP/hatchmind-pages"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public game
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/hatchmind-pages
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
