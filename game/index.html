<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#cdc8de" />
    <meta
      name="description"
      content="HatchMind — 나만의 뉴로링을 키우는 1인 도트 육성 게임. 회원가입과 지갑 연결 없이 바로 플레이하세요."
    />
    <title>HatchMind · 나만의 뉴로링</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <svg
      class="icon-definitions"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <defs></defs>
    </svg>

    <div class="app-shell">
      <header class="topbar">
        <a href="#home" class="brand"
          ><span class="brand-mark" id="sidebar-egg" aria-hidden="true"></span
          ><span class="brand-text">HatchMind<small>뉴로링 육성 게임</small></span></a
        >
        <nav class="navigation" aria-label="주 메뉴">
          <a href="#home" data-route="home"
            ><svg class="icon"><use href="#i-home" /></svg><span>정원</span></a
          >
          <a href="#collection" data-route="collection"
            ><svg class="icon"><use href="#i-grid" /></svg><span>친구들</span
            ><b id="pet-count">4</b></a
          >
          <a href="#traits" data-route="traits"
            ><svg class="icon"><use href="#i-neuron" /></svg><span>성향</span></a
          >
          <a href="#dating" data-route="dating"
            ><svg class="icon"><use href="#i-heart" /></svg><span>만남</span></a
          >
          <a href="#eggs" data-route="eggs"
            ><svg class="icon"><use href="#i-egg" /></svg><span>알 둥지</span
            ><b id="egg-count">0</b></a
          >
          <a href="#family" data-route="family"
            ><svg class="icon"><use href="#i-branch" /></svg><span>가계도</span></a
          >
        </nav>
        <div class="topbar-actions">
          <button class="icon-button" id="share-button" data-action="share" aria-label="게임 링크 공유" title="게임 링크 공유"><svg class="icon"><use href="#i-arrow" /></svg></button>
          <button class="demo-note" data-action="about" aria-label="체험 모드 안내">
            <span class="status-dot"></span>체험 모드
          </button>
          <button class="icon-button" id="sound-button" data-action="sound" aria-label="효과음 켜기" aria-pressed="false">
            <svg class="icon"><use href="#i-volume" /></svg>
          </button>
          <button class="icon-button" id="theme-button" data-action="theme" aria-label="밤 풍경으로 바꾸기">
            <svg class="icon"><use href="#i-moon" /></svg>
          </button>
          <label class="wallet-switch"
            ><span class="wallet-avatar" id="wallet-avatar">1</span
            ><select id="wallet-select" aria-label="이 기기의 플레이 계정 선택">
              <option value="user1">user1</option>
              <option value="user2">user2</option>
              <option value="user3">user3</option>
              <option value="user4">user4</option>
            </select></label
          >
        </div>
        <span class="visually-hidden" id="breadcrumb-title">나의 정원</span>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer class="page-footer">
        <span>혼자 플레이 · 진행 상황은 이 브라우저에 저장돼요</span
        ><span>HatchMind</span>
      </footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog"><div id="dialog-content"></div></dialog>
    <noscript
      >친구들과 상호작용하려면 브라우저의 JavaScript를 켜 주세요.</noscript
    >
  </body>
</html>
